name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 3.9 because Ryu 4.34 needs it (ADR-001). Keep this in step with the Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests topology experiments

      - name: Unit tests
        run: pytest tests -q --cov=src --cov-report=term-missing

      # Guard rails on the ST-1 gate: these must never silently change.
      - name: Grammar freeze check
        run: pytest tests/test_intent_validation.py -q -k "frozen or five or three or scale or unknown_fields"

  build-image:
    runs-on: ubuntu-22.04
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned image
        run: docker build -t team16/intent-sdn-sla:ci .
