# One command to a running system:  docker compose up --build -d
#
# Mininet / OVS need Linux network namespaces and a privileged SDN container.
# The operator dashboard is published only on localhost; M1 stays internal.
services:
  sdn:
    build:
      context: .
      dockerfile: Dockerfile
    image: team16/intent-sdn-sla:dev
    container_name: intent-sdn-sla
    privileged: true
    network_mode: host
    volumes:
      - .:/app
      - /lib/modules:/lib/modules:ro
    working_dir: /app
    command: bash
    stdin_open: true
    tty: true

  intent-api:
    image: team16/intent-sdn-sla:dev
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: []
    command:
      - python3.9
      - -m
      - uvicorn
      - src.intent_manager.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    working_dir: /app
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      - sdn

  dashboard:
    image: team16/intent-sdn-sla:dev
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: []
    command:
      - python3.9
      - -m
      - uvicorn
      - src.dashboard.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      TEAM16_INTENT_API_URL: http://intent-api:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - sdn
      - intent-api
