# One command to a running system:  docker compose up --build
#
# NOTE: Mininet and Open vSwitch need kernel network namespaces and the OVS
# datapath, so the SDN container runs privileged with host networking.
# The read-only dashboard is isolated and published only on localhost.
services:
  sdn:
    build:
      context: .
      dockerfile: Dockerfile
    image: team16/intent-sdn-sla:dev
    container_name: intent-sdn-sla
    privileged: true            # required by Mininet / OVS datapath
    network_mode: host          # Ryu listens on 6653
    volumes:
      - .:/app                  # live code reload during development
      - /lib/modules:/lib/modules:ro
    working_dir: /app
    command: bash
    stdin_open: true
    tty: true

  intent-api:
    image: team16/intent-sdn-sla:dev
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: []
    command:
      - python3.9
      - -m
      - uvicorn
      - src.intent_manager.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    working_dir: /app
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      - sdn

  seed-demo-intents:
    image: team16/intent-sdn-sla:dev
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: []
    command:
      - python3.9
      - scripts/seed_demo_intents.py
    working_dir: /app
    volumes:
      - .:/app
    environment:
      TEAM16_INTENT_API_URL: http://intent-api:8000
    depends_on:
      - intent-api
    restart: "no"

  dashboard:
    image: team16/intent-sdn-sla:dev
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: []
    command:
      - python3.9
      - -m
      - uvicorn
      - src.dashboard.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - sdn
